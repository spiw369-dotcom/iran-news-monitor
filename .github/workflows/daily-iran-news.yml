name: Daily Iran News Monitor

on:
  schedule:
    # هر ساعت، در دقیقه‌ی صفر
    - cron: "0 * * * *"
  workflow_dispatch: {}  # امکان اجرای دستی از تب Actions هم هست

permissions:
  contents: write  # برای این‌که بتونه فایل حافظه (seen_links.json) رو ذخیره کنه

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python iran_news_monitor.py

      - name: Save memory file back to the repo
        run: |
          git config user.name "iran-news-bot"
          git config user.email "actions@github.com"
          git add seen_links.json
          git diff --staged --quiet || git commit -m "Update seen links"
          git push
